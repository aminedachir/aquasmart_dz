<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','sans-serif']},colors:{ocean:'#0B4F6C',leaf:'#2E8B57',mint:'#88D498',app:'#F4F7F6'}}}}</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
  html{-webkit-tap-highlight-color:transparent}
  body{overscroll-behavior-y:none}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{animation:spin 1s linear infinite}
</style>
