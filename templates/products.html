{% extends 'base.html' %}{% block title %}المنتجات{% endblock %}{% block page_title %}المنتجات{% endblock %}
{% block content %}

<!-- شريط البحث والتصفية -->
<div class="bg-white rounded-[1.5rem] p-3 shadow-soft mb-5 animate__animated animate__fadeIn">
  <form method="GET" action="{{ url_for('products') }}" class="flex flex-col gap-3">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" name="q" value="{{ search_query }}" placeholder="ابحث عن منتج..." 
             class="w-full h-12 rounded-2xl bg-slate-50 border-none pr-12 pl-4 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-leaf/50">
    </div>
    <div class="flex gap-2 overflow-x-auto no-scrollbar">
      <button type="submit" name="sort" value="newest" 
              class="shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition {{ 'bg-ocean text-white shadow-md' if sort_by=='newest' else 'bg-slate-100 text-slate-600 hover:bg-slate-200' }}">
        الأحدث
      </button>
      <button type="submit" name="sort" value="price_asc" 
              class="shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition {{ 'bg-ocean text-white shadow-md' if sort_by=='price_asc' else 'bg-slate-100 text-slate-600 hover:bg-slate-200' }}">
        الأرخص
      </button>
      <button type="submit" name="sort" value="price_desc" 
              class="shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition {{ 'bg-ocean text-white shadow-md' if sort_by=='price_desc' else 'bg-slate-100 text-slate-600 hover:bg-slate-200' }}">
        الأغلى
      </button>
    </div>
  </form>
</div>

<!-- شبكة المنتجات -->
<div class="grid grid-cols-2 gap-4">
{% for p in products %}
  <div class="bg-white rounded-[1.5rem] shadow-soft overflow-hidden flex flex-col border border-slate-100/60 animate__animated animate__fadeInUp" style="animation-delay: {{ loop.index0 * 0.05 }}s">
    <div class="relative h-32 overflow-hidden">
      <img src="{{ p.image_url }}" class="w-full h-full object-cover" alt="">
    </div>
    <div class="p-3 flex-1 flex flex-col">
      <h3 class="font-extrabold text-sm leading-tight text-ocean">{{ p.name }}</h3>
      <p class="text-[10px] text-slate-400 mt-1 flex-1 line-clamp-2">{{ p.description }}</p>
      
      <div class="flex items-center justify-between mt-2">
        <span class="font-black text-leaf text-sm">{{ '%g' % p.price }} <span class="text-[9px]">د.ج</span></span>
      </div>
      
      <!-- نموذج الإضافة مع تحديد الكمية -->
      <form method="post" action="{{ url_for('cart_add', kind='p', item_id=p.id) }}" class="flex items-center gap-2 mt-2">
        <div class="flex items-center bg-slate-50 rounded-xl border border-slate-200 h-9 overflow-hidden w-16">
          <input type="number" name="quantity" value="1" min="1" max="99" 
                 class="w-full h-full text-center text-sm font-bold text-ocean bg-transparent focus:outline-none">
        </div>
        <button class="flex-1 h-9 rounded-xl bg-ocean text-white text-xs font-bold shadow-sm active:scale-90 transition flex items-center justify-center gap-1 hover:bg-leaf">
          <i class="fa-solid fa-cart-plus"></i> أضف
        </button>
      </form>
    </div>
  </div>
{% else %}
  <div class="col-span-2 text-center py-12 animate__animated animate__fadeIn">
    <div class="h-20 w-20 mx-auto bg-slate-100 rounded-full flex items-center justify-center mb-4">
      <i class="fa-solid fa-box-open text-3xl text-slate-300"></i>
    </div>
    <p class="font-bold text-slate-600">لا توجد منتجات تطابق بحثك.</p>
    <a href="{{ url_for('products') }}" class="inline-block mt-3 text-leaf font-extrabold text-sm bg-leaf/10 px-4 py-2 rounded-full">مسح البحث</a>
  </div>
{% endfor %}
</div>
{% endblock %}
