<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','sans-serif']},colors:{ocean:'#0B4F6C',leaf:'#2E8B57',mint:'#88D498',app:'#F4F7F6'}}}}</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
  html{-webkit-tap-highlight-color:transparent} body{overscroll-behavior-y:none}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom)}
  @keyframes spin{to{transform:rotate(360deg)}} .spinner{animation:spin 1s linear infinite}
</style>
<title>AquaSmart DZ</title>
</head>
<style>
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .a-pop{animation:pop .8s ease-out both}
  .a-rise{animation:rise .7s ease-out .5s both}
  .a-rise2{animation:rise .7s ease-out .7s both}
</style>
<body class="bg-[#06303f] font-sans text-white">
<!-- الشاشة الافتتاحية (المسار / العام) -->
<main id="splash" class="relative max-w-[480px] mx-auto min-h-[100dvh] overflow-hidden flex flex-col transition-opacity duration-500"
      style="background:#06303f url('{{ url_for('static', filename='images/hero.jpg') }}') 50% 72%/cover no-repeat">

  <!-- تدرّج: أزرق داكن في الأعلى ← الصورة واضحة في الوسط ← أخضر داكن في الأسفل -->
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(5,52,72,.98) 0%,rgba(7,72,94,.9) 26%,rgba(7,72,94,.15) 46%,rgba(4,44,36,.2) 60%,rgba(3,46,34,.93) 100%)"></div>

  <div class="relative z-10 flex flex-col items-center text-center px-6 pt-12 a-pop">
    <img src="{{ url_for('static', filename='images/logo.png') }}"
         onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/logo.svg') }}'"
         class="h-36 w-36 drop-shadow-[0_6px_14px_rgba(0,0,0,.35)]" alt="AquaSmart DZ">
    <h1 dir="ltr" class="mt-3 text-[2.7rem] font-extrabold leading-none tracking-tight">AquaSmart <span class="text-[#38A5E6]">DZ</span></h1>
    <p class="mt-5 text-lg font-bold" style="text-shadow:0 2px 8px rgba(0,0,0,.6)">أكوابونيك ذكي... غذاء مستدام لمستقبل أفضل</p>
  </div>

  <div class="flex-1"></div>

  <div class="relative z-10 px-6 pb-9">
    {% if logged %}
      <!-- مستخدم مسجّل: مؤشر تحميل ثم /home -->
      <div class="flex flex-col items-center gap-3 pb-6 a-rise">
        <div class="h-9 w-9 rounded-full border-4 border-white/30 border-t-[#88D498]" style="animation:spin 1s linear infinite"></div>
        <span class="text-sm font-bold opacity-90">أهلاً بعودتك…</span>
      </div>
    {% else %}
      <a href="{{ url_for('login') }}" class="a-rise block h-14 leading-[3.5rem] rounded-2xl bg-[#2E9B48] text-center text-lg font-extrabold shadow-xl active:scale-95 transition">تسجيل الدخول</a>
      <a href="{{ url_for('signup') }}" class="a-rise2 mt-3 block h-14 leading-[3.5rem] rounded-2xl bg-white text-slate-700 text-center text-lg font-extrabold shadow-xl active:scale-95 transition">إنشاء حساب جديد</a>
    {% endif %}
    <div class="mt-7 flex items-center justify-center gap-5 text-base font-bold">
      <span>العربية</span><span class="h-5 w-px bg-white/50"></span>
      <button type="button" onclick="soon()" class="opacity-90">Français</button>
    </div>
  </div>

  <div id="toast" class="fixed bottom-24 inset-x-0 mx-auto w-fit max-w-[90%] z-20 rounded-full bg-black/70 px-5 py-2 text-sm font-bold opacity-0 transition-opacity">النسخة الفرنسية قريباً</div>
</main>
<script>
  function soon(){var t=document.getElementById('toast');t.style.opacity=1;setTimeout(function(){t.style.opacity=0},2000)}
  {% if auto %}
  // بعد 2.5 ثانية: تلاشٍ ثم انتقال (المسجّل ← /home، والزائر ← /login إن فُعّل الخيار)
  setTimeout(function(){
    document.getElementById('splash').style.opacity=0;
    setTimeout(function(){location.replace("{{ target }}")},400);
  },2500);
  {% endif %}
</script>
</body></html>
